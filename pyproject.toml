[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "episynth"
description = "Estimating epiplexity on synthetic time series with small models on a single GPU."
readme = "README.rst"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Epiplexity team" }]
dynamic = ["version"]

# Runtime deps kept minimal on purpose: heavy/optional stacks are added as
# [project.optional-dependencies] on later stages.
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    # episynth: generators, windows, Moirai port, training, GIFT-Eval evaluation
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "pydantic>=2.0",
    "safetensors>=0.4",
    "pyarrow>=14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "matplotlib>=3.7",
    "jupyter>=1.0",
    "nbconvert>=7.0",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
]
# episynth checks against the original generators (Mix, Don't Pick) need their libraries
checks = ["fbm==0.3.0", "timesynth @ git+https://github.com/TimeSynth/TimeSynth.git"]

[project.urls]
Repository = "https://github.com/intsystems/Epiplexity"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "episynth.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# episynth: shapes and sizes carry the names of the docstrings (B, S, P, L, T, K)
"src/episynth/**" = ["N803", "N806", "N812"]
"src/episynth/evaluation/gift_eval.py" = ["SIM905"]
"tests/episynth/**" = ["N806"]
