name: test
on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install -U ruff

      - name: Linting
        run: |
          ruff check src/ tests/ code/

  pytest:
    name: pytest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # CPU wheels of torch: the tests need no GPU.
      - name: Install Dependencies
        run: |
          pip install -U torch --index-url https://download.pytorch.org/whl/cpu
          pip install -U -e . pytest pytest-cov

      - name: Testing
        run: |
          pytest tests/ --cov=epimeter --cov-report=term-missing
