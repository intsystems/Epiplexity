name: test
on: [push, pull_request, workflow_dispatch]

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python - <<'PYTHON'
          import subprocess
          import sys
          import tomllib

          with open("uv.lock", "rb") as lockfile:
              packages = tomllib.load(lockfile)["package"]
          version = next(p["version"] for p in packages if p["name"] == "ruff")
          subprocess.check_call([sys.executable, "-m", "pip", "install", f"ruff=={version}"])
          PYTHON

      - name: Linting
        run: |
          ruff check src/ tests/ experiments/demos/ doc/source/conf.py

  pytest:
    name: pytest
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "4"
      MKL_NUM_THREADS: "4"
      OPENBLAS_NUM_THREADS: "4"

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # CPU wheels of torch: the tests need no GPU.
      - name: Install Dependencies
        run: |
          pip install -U torch --index-url https://download.pytorch.org/whl/cpu
          pip install -U -e . pytest pytest-cov

      - name: Testing
        run: |
          pytest tests/ --cov=episynth --cov-report=term-missing
